<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" role="img" aria-label="Issika Aymeric Kouamé, Full-Stack AI Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#14183a"/><stop offset="1" stop-color="#0c2a52"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/><stop offset="0.5" stop-color="#93c5fd"/><stop offset="1" stop-color="#c4b5fd"/>
      <animate attributeName="x1" values="0;-1;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.55"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/></pattern>
    <clipPath id="clip"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>
  <style>
    .name{font:800 54px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-1px}
    .role{font:500 24px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#7dd3fc}
    .tag{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94a3b8;letter-spacing:2px}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <circle cx="170" cy="70" r="190" fill="url(#glow)"><animateTransform attributeName="transform" type="translate" values="0 0;60 25;0 0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="230" r="210" fill="url(#glow2)"><animateTransform attributeName="transform" type="translate" values="0 0;-70 -20;0 0" dur="13s" repeatCount="indefinite"/></circle>
    <g fill="#7dd3fc" fill-opacity="0.65">
      <circle cx="120" cy="210" r="2.2"><animate attributeName="cy" values="210;60;210" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="40" r="1.8"><animate attributeName="cy" values="40;240;40" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="230" r="2.4"><animate attributeName="cy" values="230;50;230" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="60" r="1.8"><animate attributeName="cy" values="60;220;60" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="250" r="1.6"><animate attributeName="cy" values="250;80;250" dur="7s" repeatCount="indefinite"/></circle>
    </g>
    <text x="500" y="52" text-anchor="middle" class="tag">&lt;/&gt;  HELLO, WORLD  &lt;/&gt;</text>
    <text x="500" y="124" text-anchor="middle" class="name" fill="url(#name)">Issika Aymeric Kouamé</text>
  <text x="500" y="178" text-anchor="middle" class="role" opacity="0">Full-Stack AI Engineer
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.01;0.04;0.2;0.24;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0;0 -8;0 -8" keyTimes="0;0.01;0.04;0.2;0.24;1" dur="14s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="178" text-anchor="middle" class="role" opacity="0">LLM Apps  ·  Async Pipelines
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.29;0.45;0.49;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0;0 -8;0 -8" keyTimes="0;0.25;0.29;0.45;0.49;1" dur="14s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="178" text-anchor="middle" class="role" opacity="0">Secure-by-Design Backends
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.54;0.7;0.74;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0;0 -8;0 -8" keyTimes="0;0.5;0.54;0.7;0.74;1" dur="14s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="178" text-anchor="middle" class="role" opacity="0">CS Student @ Africa Vision University
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.79;0.95;0.99;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0;0 -8;0 -8" keyTimes="0;0.75;0.79;0.95;0.99;1" dur="14s" repeatCount="indefinite"/>
  </text>
    <path d="M0 262 Q 125 240 250 262 T 500 262 T 750 262 T 1000 262 V280 H0Z" fill="#60a5fa" fill-opacity="0.18">
      <animateTransform attributeName="transform" type="translate" values="0 0;-250 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M0 270 Q 125 252 250 270 T 500 270 T 750 270 T 1000 270 V280 H0Z" fill="#a78bfa" fill-opacity="0.22">
      <animateTransform attributeName="transform" type="translate" values="-250 0;0 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
